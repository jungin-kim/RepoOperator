[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repooperator-local-worker"
version = "0.1.0"
description = "Local FastAPI worker for RepoOperator repository and command operations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "langgraph>=1.0,<2.0",
]

[project.optional-dependencies]
# Accurate multi-language symbol extraction for the codebase index. Optional so
# core onboarding never fails when a prebuilt grammar wheel is unavailable for a
# platform — the index then runs in regex-only mode. Installed via the CLI as
# `pip install -e ".[index]"` with a fallback to the core install.
index = [
  "tree-sitter-language-pack>=0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repooperator_worker = ["prompts/*.md"]
